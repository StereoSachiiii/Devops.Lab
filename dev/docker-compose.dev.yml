name: devops-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres-dev
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5444:5432"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devops-redis-dev
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  dev-net:
    name: devops-dev-net
    driver: bridge

volumes:
  postgres-dev-data:
