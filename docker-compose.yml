services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${KAFKA_ADVERTISED_HOST:-localhost}:19092
    deploy:
      resources:
        limits:
          memory: 1536M
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
      - "${KAFKA_INTERNAL_PORT}:${KAFKA_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 5s
      timeout: 10s
      retries: 5

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BROKERS="redpanda:9092"

        create_topic() {
          local name=$1 partitions=$2 retention_ms=$3
          rpk topic create $$name \
            --brokers $$BROKERS \
            --partitions $$partitions \
            --replicas 1 \
            --topic-config retention.ms=$$retention_ms \
            --topic-config cleanup.policy=delete \
            2>&1 | grep -v "TOPIC_ALREADY_EXISTS" || true
          echo "Topic ready: $$name (partitions=$$partitions, retention=$${retention_ms}ms)"
        }

        # Domain events (Kafka) — high partition count for parallel consumers, 7-day retention
        create_topic identity.user.registered           4  604800000
        create_topic identity.email.verification        4  604800000
        create_topic sandbox.session.started            8  604800000
        create_topic sandbox.session.ended              8  604800000
        create_topic sandbox.challenge.solved           4  604800000
        create_topic sandbox.challenge.failed           4  604800000

        echo "All Kafka topics provisioned."

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    ports:
      - "${REDPANDA_CONSOLE_PORT}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGT_PORT}:15672"
      - "15692:15692"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  sandbox-worker-docker:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    container_name: sandbox-worker-docker
    user: root
    ports:
      - "${SANDBOX_WORKER_PORT:-8090}:8090"
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HTTP_PORT: "8090"
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: sandbox-worker
      KAFKA_GROUP_ID: sandbox-sessions
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_TTL_MINS: "60"
      MAX_MEMORY_MB: "512"
      MAX_CPUS: "1.0"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/appdb?sslmode=disable"
      DOCKER_NETWORK_MODE: "none"
      RABBITMQ_URL: amqp://rabbitmq:5672
      SANDBOX_PROVIDER: "docker"
      WORKER_ADDR: "sandbox-worker-docker:8090"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - workers

  sandbox-worker-gvisor:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    container_name: sandbox-worker-gvisor
    user: root
    ports:
      - "${SANDBOX_WORKER_GVISOR_PORT:-8091}:8090"
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HTTP_PORT: "8090"
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: sandbox-worker
      KAFKA_GROUP_ID: sandbox-sessions
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_TTL_MINS: "60"
      MAX_MEMORY_MB: "512"
      MAX_CPUS: "1.0"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/appdb?sslmode=disable"
      DOCKER_NETWORK_MODE: "none"
      RABBITMQ_URL: amqp://rabbitmq:5672
      SANDBOX_PROVIDER: "gvisor"
      WORKER_ADDR: "sandbox-worker-gvisor:8090"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - workers

  sandbox-router:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    container_name: sandbox-router
    user: nonroot
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    entrypoint: ["/sandbox-router"]
    restart: unless-stopped
    profiles:
      - workers



  api-gateway:
    image: kong:3.6.1-ubuntu
    container_name: api-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "4 64k"
      KONG_DNS_ORDER: "LAST,A,CNAME,AAAA"
    ports:
      - "${API_GATEWAY_PORT}:8000"
      - "${API_GATEWAY_SECURE_PORT}:8443"
      - "${API_GATEWAY_ADMIN_PORT}:8001"
      - "${API_GATEWAY_ADMIN_SECURE_PORT}:8444"
    volumes:
      - ./infra/kong/kong.yml:/usr/local/kong/declarative/kong.yml
    extra_hosts:
      - "auth-service:host-gateway"
      - "core-service:host-gateway"
      - "sandbox-service:${SANDBOX_SERVICE_HOST:-host-gateway}"
      - "sandbox-router:${SANDBOX_SERVICE_HOST:-host-gateway}"
      - "sandbox-worker-docker:${SANDBOX_SERVICE_HOST:-host-gateway}"
      - "sandbox-worker-gvisor:${SANDBOX_SERVICE_HOST:-host-gateway}"
      - "host-gateway:host-gateway"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.83.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "${OTEL_HTTP_PORT}:4318" # OTLP HTTP
      - "${OTEL_GRPC_PORT}:4317" # OTLP gRPC
    volumes:
      - ./infra/otel-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped
    profiles:
      - observability

  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    user: root
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
      - loki-wal:/wal
    restart: unless-stopped
    profiles:
      - observability

  promtail:
    image: grafana/promtail:2.8.2
    container_name: promtail
    volumes:
      - ./infra/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - observability

  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "${TEMPO_PORT}:3200"   # Tempo query API (for Grafana)
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    profiles:
      - observability

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped
    profiles:
      - observability

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/appdb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    restart: unless-stopped
    profiles:
      - observability

  redis-exporter:
    image: bitnami/redis-exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9121:9121"
    restart: unless-stopped
    profiles:
      - observability

volumes:
  loki-data:
  loki-wal:
  tempo-data:
  prometheus-data:
  grafana-data:
  postgres-data:

