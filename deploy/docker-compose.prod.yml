services:
  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 0: Core Infrastructure (Parallel)
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    env_file:
      - ../.env.prod
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    env_file:
      - ../.env.prod
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGT_PORT:-15672}:15672"
      - "15692:15692"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    env_file:
      - ../.env.prod
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --reserve-memory 0M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${KAFKA_ADVERTISED_HOST:-localhost}:19092
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 1: One-Shot Initialization & Migrations (Must complete successfully)
  # ═══════════════════════════════════════════════════════════════════════════
  db-migrate:
    build:
      context: ..
      dockerfile: services/core/Dockerfile
    container_name: db-migrate
    env_file:
      - ../.env.prod
    networks:
      - app-internal
    command: ["npx", "prisma", "migrate", "deploy", "--schema=packages/db/prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda-init
    env_file:
      - ../.env.prod
    networks:
      - app-internal
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BROKERS="redpanda:9092"
        create_topic() {
          local name=$$1 partitions=$$2 retention_ms=$$3
          rpk topic create $$name --brokers $$BROKERS --partitions $$partitions --replicas 1 --topic-config retention.ms=$$retention_ms --topic-config cleanup.policy=delete 2>&1 | grep -v "TOPIC_ALREADY_EXISTS" || true
          echo "Topic ready: $$name"
        }
        create_topic identity.user.registered 4 604800000
        create_topic identity.email.verification 4 604800000
        create_topic sandbox.session.started 8 604800000
        create_topic sandbox.session.ended 8 604800000
        create_topic sandbox.challenge.solved 4 604800000
        create_topic sandbox.challenge.failed 4 604800000
        echo "All Kafka topics provisioned."
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 2: Application Microservices & Workers (Parallel after Tier 1)
  # ═══════════════════════════════════════════════════════════════════════════
  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-devops/auth-service:1.0.0}
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    env_file:
      - ../.env.prod
    environment:
      PORT: ${AUTH_SERVICE_PORT:-3002}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3002}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      KAFKA_CLIENT_ID: auth-service
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-/var/log/services}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  core-service:
    image: ${CORE_SERVICE_IMAGE:-devops/core-service:1.0.0}
    build:
      context: ..
      dockerfile: services/core/Dockerfile
    container_name: core-service
    env_file:
      - ../.env.prod
    environment:
      PORT: ${CORE_SERVICE_PORT:-3003}
      CORE_SERVICE_PORT: ${CORE_SERVICE_PORT:-3003}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://rabbitmq:5672}
      SESSION_TTL_MINS: ${SESSION_TTL_MINS:-60}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-/var/log/services}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    image: ${NOTIFICATION_SERVICE_IMAGE:-devops/notification-service:1.0.0}
    build:
      context: ..
      dockerfile: services/notification/Dockerfile
    container_name: notification-service
    env_file:
      - ../.env.prod
    environment:
      PORT: ${NOTIFICATION_SERVICE_PORT:-3004}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-3004}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://rabbitmq:5672}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-/var/log/services}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  sandbox-router:
    image: ${SANDBOX_ROUTER_IMAGE:-devops/sandbox-router:1.0.0}
    build:
      context: ../services/sandbox
      dockerfile: Dockerfile
    container_name: sandbox-router
    env_file:
      - ../.env.prod
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    entrypoint: ["/sandbox-router"]
    ports:
      - "${SANDBOX_ROUTER_PORT:-8080}:8080"
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  sandbox-worker:
    image: ${SANDBOX_WORKER_IMAGE:-devops/sandbox-worker:1.0.0}
    build:
      context: ../services/sandbox
      dockerfile: Dockerfile
    container_name: sandbox-worker
    user: root
    env_file:
      - ../.env.prod
    environment:
      HTTP_PORT: "8090"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      KAFKA_CLIENT_ID: sandbox-worker
      KAFKA_GROUP_ID: sandbox-sessions
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_TTL_MINS: ${SESSION_TTL_MINS:-60}
      MAX_MEMORY_MB: ${MAX_MEMORY_MB:-512}
      MAX_CPUS: ${MAX_CPUS:-1.0}
      DOCKER_NETWORK_MODE: ${DOCKER_NETWORK_MODE:-none}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://rabbitmq:5672}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      WORKER_ADDR: "sandbox-worker:8090"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 3: Edge API Gateway (Kong)
  # ═══════════════════════════════════════════════════════════════════════════
  api-gateway:
    image: kong:3.6.1-ubuntu
    container_name: api-gateway
    env_file:
      - ../.env.prod
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: "4 64k"
    volumes:
      - ../infra/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "${API_GATEWAY_PORT:-8005}:8000"
      - "${API_GATEWAY_SECURE_PORT:-8443}:8443"
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      auth-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
      sandbox-router:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER 4: Presentation / Web Frontend
  # ═══════════════════════════════════════════════════════════════════════════
  web-frontend:
    image: ${WEB_FRONTEND_IMAGE:-devops/web-frontend:1.0.0}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: web-frontend
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8005
    ports:
      - "${WEB_FRONTEND_PORT:-3000}:3000"
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # Observability Stack (Parallel with Tier 0)
  # ═══════════════════════════════════════════════════════════════════════════
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - ../infra/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - app-internal
    restart: unless-stopped
    profiles:
      - observability

  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    user: root
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ../infra/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
      - loki-wal:/wal
    networks:
      - app-internal
    restart: unless-stopped
    profiles:
      - observability

  promtail:
    image: grafana/promtail:2.8.2
    container_name: promtail
    volumes:
      - ../infra/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - app-internal
    restart: unless-stopped
    profiles:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.83.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_GRPC_PORT:-4317}:4317"
    volumes:
      - ../infra/otel-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo
    networks:
      - app-internal
    restart: unless-stopped
    profiles:
      - observability

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ../infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-internal
    restart: unless-stopped
    profiles:
      - observability

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    env_file:
      - ../.env.prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - app-internal
    restart: unless-stopped
    profiles:
      - observability

networks:
  app-internal:
    driver: bridge

volumes:
  postgres-data:
  loki-data:
  loki-wal:
  tempo-data:
  prometheus-data:
  grafana-data:
