# Note: Deployed via `helm upgrade --install redis bitnami/redis -n devops-platform -f deploy/helm/redis-values.yaml`
# Exposes service `redis.devops-platform.svc.cluster.local:6379` via HAProxy
# ─────────────────────────────────────────────────────────────────────────────

