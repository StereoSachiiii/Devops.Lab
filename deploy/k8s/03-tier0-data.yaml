# TIER 0: Stateful Infrastructure (Databases & Message Brokers)
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-platform
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-coordinator
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-worker-headless
  namespace: devops-platform
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app: postgres-worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-coordinator
  namespace: devops-platform
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres-coordinator
  template:
    metadata:
      labels:
        app: postgres-coordinator
    spec:
      containers:
        - name: postgres
          image: citusdata/citus:12.1-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          volumeMounts:
            - name: coordinator-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/init-wrapper.sh
              subPath: init-wrapper.sh
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-script
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: coordinator-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-worker
  namespace: devops-platform
spec:
  serviceName: "postgres-worker-headless"
  replicas: 2
  selector:
    matchLabels:
      app: postgres-worker
  template:
    metadata:
      labels:
        app: postgres-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgres-worker
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: postgres-worker
          image: citusdata/citus:12.1-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          volumeMounts:
            - name: worker-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/init-wrapper.sh
              subPath: init-wrapper.sh
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-script
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: worker-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi

# ─────────────────────────────────────────────────────────────────────────────
