apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devops-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: "auth-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["auth-service.devops-dev.svc.cluster.local:3002"]

      - job_name: "core-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["core-service.devops-dev.svc.cluster.local:3003"]

      - job_name: "notification-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["notification-service.devops-dev.svc.cluster.local:3004"]

      - job_name: "sandbox-router"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["sandbox-router.devops-dev.svc.cluster.local:8080"]

      - job_name: "sandbox-worker"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["sandbox-worker-0.sandbox-worker.devops-dev.svc.cluster.local:8090"]

      - job_name: "api-gateway"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["api-gateway.devops-dev.svc.cluster.local:8000"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: devops-dev
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: devops-dev
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: devops-dev
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.devops-dev.svc.cluster.local:9090
        isDefault: true
        editable: true
        uid: prometheus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: devops-dev
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: devops-dev
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana
