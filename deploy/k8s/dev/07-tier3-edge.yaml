# =============================================================================
# DEV TIER 3: Edge API Gateway (Kong) & Web Frontend (Matches Prod Architecture)
# Replicas: 1 each (No HPA/PDB needed in dev, low memory footprint)
# Service Type: NodePort for direct local port access via KinD hostPort
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Kong Declarative ConfigMap
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: devops-dev
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
            - http://127.0.0.1:3000
            - http://localhost
            - http://127.0.0.1
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Cookie
            - Cache-Control
            - Pragma
            - Expires
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          second: 100
          limit_by: credential
          policy: redis
          redis:
            host: redis.devops-dev.svc.cluster.local
            port: 6379
            password: ${REDIS_PASSWORD}
            database: 1

    services:
      - name: core-service
        url: http://core-service.devops-dev.svc.cluster.local:3003
        routes:
          - name: challenge-routes
            paths: [ /api/challenges ]
            strip_path: false
          - name: session-routes
            paths: [ /api/session ]
            strip_path: false
          - name: content-routes
            paths: [ /api/content ]
            strip_path: false
          - name: org-routes
            paths: [ /api/orgs ]
            strip_path: false
          - name: user-routes
            paths: [ /api/users ]
            strip_path: false
          - name: leaderboards-routes
            paths: [ /api/leaderboards ]
            strip_path: false

      - name: auth-service
        url: http://auth-service.devops-dev.svc.cluster.local:3002
        routes:
          - name: auth-routes
            paths: [ /api/auth ]
            strip_path: false

      - name: sandbox-router
        url: http://sandbox-router.devops-dev.svc.cluster.local:8080
        routes:
          - name: sandbox-session-routes
            paths: [ /sessions ]
            strip_path: false
          - name: sandbox-validate-routes
            paths: [ /validate ]
            strip_path: false
---
# ─────────────────────────────────────────────────────────────────────────────
# Kong API Gateway
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: devops-dev
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30005
      name: http
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: devops-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: kong:3.6.1-ubuntu
          ports:
            - containerPort: 8000
            - containerPort: 8443
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/usr/local/kong/declarative/kong.yml"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_PROXY_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: kong-config-vol
              mountPath: /usr/local/kong/declarative/kong.yml
              subPath: kong.yml
      volumes:
        - name: kong-config-vol
          configMap:
            name: kong-config
---
# ─────────────────────────────────────────────────────────────────────────────
# Web Frontend
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: devops-dev
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
  selector:
    app: web-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: devops-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: devops/web-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          env:
            - name: NODE_ENV
              value: "development"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
