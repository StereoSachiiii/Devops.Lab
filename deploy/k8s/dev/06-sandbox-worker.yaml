# =============================================================================
# DEV TIER 2: Sandbox Worker (StatefulSet with DinD sidecar)
# Replicas: 1
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: sandbox-worker
  namespace: devops-dev
spec:
  clusterIP: None
  ports:
    - port: 8090
      targetPort: 8090
  selector:
    app: sandbox-worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sandbox-worker
  namespace: devops-dev
spec:
  serviceName: "sandbox-worker"
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-worker
  template:
    metadata:
      labels:
        app: sandbox-worker
    spec:
      containers:
        # 1. The actual Sandbox Worker (Go App)
        - name: sandbox-worker
          image: devops/sandbox-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["/sandbox-worker"]
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          env:
            - name: HTTP_PORT
              value: "8090"
            - name: WORKER_ADDR
              value: "sandbox-worker.devops-dev.svc.cluster.local:8090"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi

        # 2. Docker-in-Docker (DinD) Sidecar
        - name: dind-daemon
          image: docker:24-dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: dind-socket
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
