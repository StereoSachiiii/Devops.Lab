# =============================================================================
# DEV TIER 2: Sandbox Worker (StatefulSet matching prod)
# Replicas: 1
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: sandbox-worker
  namespace: devops-dev
spec:
  clusterIP: None
  ports:
    - port: 8090
      targetPort: 8090
  selector:
    app: sandbox-worker
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sandbox-worker
  namespace: devops-dev
spec:
  serviceName: "sandbox-worker"
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-worker
  template:
    metadata:
      labels:
        app: sandbox-worker
    spec:
      containers:
        - name: sandbox-worker
          image: devops/sandbox-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["/sandbox-worker"]
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          env:
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
