apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-config
  namespace: devops-dev
data:
  # Database Config
  POSTGRES_DB: "appdb"
  POSTGRES_USER: "postgres"
  
  # Message Broker Config (Dev internal endpoints)
  KAFKA_BROKERS: "redpanda.devops-dev.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "dev-client"
  KAFKA_GROUP_ID: "sandbox-sessions-dev"
  KAFKA_ADVERTISED_HOST: "redpanda"
  
  # Service Settings
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
  SERVICE_VERSION: "1.0.0-dev"
  SESSION_TTL_MINS: "60"
  MAX_MEMORY_MB: "256"
  MAX_CPUS: "0.5"
  DOCKER_NETWORK_MODE: "none"
  SANDBOX_PROVIDER: "docker"
  OUTBOX_INTERVAL_MS: "1000"
  CORS_ORIGIN: "https://localhost,http://localhost,http://localhost:3000,http://127.0.0.1:3000"
  ALLOWED_ORIGINS: "https://localhost,http://localhost,http://localhost:3000,http://127.0.0.1:3000"
  DOMAIN: "localhost"
  JWT_ISSUER: "devops-platform"
  MFA_APP_NAME: "DevOps-Dev"
  FRONTEND_URL: "http://localhost:3000"
  WEB_APP_URL: "http://localhost:3000"
  EXPIRY_MFA_TOKEN: "5m"
  EXPIRY_REFRESH_TOKEN: "30d"
  GUEST_TRIAL_TTL_MINS: "10"
  DEFAULT_USER_ROLE: "LEARNER"
  PUBLIC_GATEWAY_URL: "http://localhost:8000"
  
  # Internal Service Ports
  POSTGRES_PORT: "5432"
  REDIS_PORT: "6379"
  RABBITMQ_PORT: "5672"
  RABBITMQ_MGT_PORT: "15672"
  API_GATEWAY_PORT: "8000"
  API_GATEWAY_SECURE_PORT: "8443"
  WEB_FRONTEND_PORT: "3000"
  AUTH_SERVICE_PORT: "3002"
  CORE_SERVICE_PORT: "3003"
  NOTIFICATION_SERVICE_PORT: "3004"
  SANDBOX_WORKER_PORT: "8090"
  SANDBOX_ROUTER_PORT: "8080"
---
