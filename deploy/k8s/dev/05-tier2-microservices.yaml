# ─────────────────────────────────────────────────────────────────────────────
# Sandbox Router
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router
  namespace: devops-dev
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: sandbox-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: devops-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      containers:
        - name: sandbox-router
          image: devops/sandbox-router:latest
          imagePullPolicy: IfNotPresent
          command: ["/sandbox-router"]
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
