# =============================================================================
# TIER 3: Edge API Gateway (Kong) & Web Frontend
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Kong Declarative ConfigMap
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: devops-platform
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    
    plugins:
      - name: cors
        config:
          origins:
            - https://localhost
            - http://localhost
            - http://localhost:3000
            - http://127.0.0.1:3000
            - http://localhost:3001
            - http://127.0.0.1:3001
            - http://127.0.0.1
            - https://127.0.0.1
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Cookie
            - Cache-Control
            - Pragma
            - Expires
          exposed_headers:
            - Set-Cookie
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          second: 100
          limit_by: credential
          policy: redis
          redis:
            host: redis.devops-platform.svc.cluster.local
            port: 6379
            password: ${REDIS_PASSWORD}
            database: 1
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
    
    services:
      - name: core-service
        url: http://core-service.devops-platform.svc.cluster.local:3003
        routes:
          - name: challenge-routes
            paths: [ /api/challenges ]
            strip_path: false
          - name: session-routes
            paths: [ /api/session ]
            strip_path: false
          - name: content-routes
            paths: [ /api/content ]
            strip_path: true
          - name: me-routes
            paths: [ /api/me ]
            strip_path: false
          - name: org-routes
            paths: [ /api/orgs ]
            strip_path: false
          - name: leaderboard-routes
            paths: [ /api/leaderboard ]
            strip_path: false
          - name: assistant-routes
            paths: [ /api/assistant ]
            strip_path: false
          - name: article-routes
            paths: [ /api/articles ]
            strip_path: false
          - name: user-routes
            paths: [ /api/users ]
            strip_path: false
          - name: share-routes
            paths: [ /api/shares ]
            strip_path: false
          - name: comment-routes
            paths: [ /api/comments ]
            strip_path: false
          - name: list-routes
            paths: [ /api/lists ]
            strip_path: false
          - name: admin-routes
            paths: [ /api/admin ]
            strip_path: false
    
      - name: auth-service
        url: http://auth-service.devops-platform.svc.cluster.local:3002
        routes:
          - name: auth-routes
            paths: [ /api/auth ]
            strip_path: true
        plugins:
          - name: rate-limiting
            config:
              second: 100
              limit_by: ip
              policy: redis
              redis:
                host: redis.devops-platform.svc.cluster.local
                port: 6379
                password: ${REDIS_PASSWORD}
                database: 1
    
      - name: sandbox-service
        url: http://sandbox-router.devops-platform.svc.cluster.local:8080
        routes:
          - name: sandbox-session-routes
            paths: [ /sessions ]
            strip_path: false
          - name: sandbox-validate-routes
            paths: [ /validate ]
            strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 500
              limit_by: credential
              policy: redis
              redis:
                host: redis.devops-platform.svc.cluster.local
                port: 6379
                password: ${REDIS_PASSWORD}
                database: 1

# ─────────────────────────────────────────────────────────────────────────────
# Kong API Gateway
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: devops-platform
spec:
  # In a real cluster, you might use type: LoadBalancer or configure an Ingress
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8000
      name: http
    - port: 8443
      targetPort: 8443
      name: https
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api-gateway
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: api-gateway
          image: kong:3.6.1-ubuntu
          ports:
            - containerPort: 8000
            - containerPort: 8443
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/usr/local/kong/declarative/kong.yml"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_PROXY_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
            - name: KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS
              value: "4 64k"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: kong-config-vol
              mountPath: /usr/local/kong/declarative/kong.yml
              subPath: kong.yml
      volumes:
        - name: kong-config-vol
          configMap:
            name: kong-config
---
# ─────────────────────────────────────────────────────────────────────────────
# Kong API Gateway High Availability (HPA + PDB)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: devops-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: devops-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# ─────────────────────────────────────────────────────────────────────────────
# Web Frontend
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: devops-platform
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: web-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          # The Docker image MUST be built passing --build-arg NEXT_PUBLIC_API_BASE_URL=https://your-domain
          image: docker.io/devops/web-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"







