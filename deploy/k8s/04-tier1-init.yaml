# =============================================================================
# TIER 1: One-Shot Initialization & Migrations
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL Init Script ConfigMap
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: devops-platform
data:
  # The wrapper script that psql entrypoint will execute
  init-wrapper.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        -- Enable Citus extension
        CREATE EXTENSION IF NOT EXISTS citus;

        DO \$\$
        BEGIN
           IF NOT EXISTS (
              SELECT FROM pg_catalog.pg_roles
              WHERE  rolname = 'app_user') THEN
              CREATE ROLE app_user LOGIN PASSWORD '$APP_USER_PASSWORD';
           ELSE
              ALTER ROLE app_user WITH PASSWORD '$APP_USER_PASSWORD';
           END IF;
        END
        \$\$;
        GRANT ALL PRIVILEGES ON DATABASE appdb TO app_user;
        \c appdb
        CREATE EXTENSION IF NOT EXISTS citus;
        GRANT ALL ON SCHEMA public TO app_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO app_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO app_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO app_user;
    EOSQL

# ─────────────────────────────────────────────────────────────────────────────
# Citus Shard Registration Job
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: batch/v1
kind: Job
metadata:
  name: citus-shard-init
  namespace: devops-platform
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec:
  template:
    spec:
      containers:
        - name: citus-init
          image: citusdata/citus:12.1-alpine
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "Waiting for Coordinator and Workers to become ready..."
              until pg_isready -h postgres.devops-platform.svc.cluster.local -p 5432; do sleep 2; done
              until pg_isready -h postgres-worker-0.postgres-worker-headless.devops-platform.svc.cluster.local -p 5432; do sleep 2; done
              until pg_isready -h postgres-worker-1.postgres-worker-headless.devops-platform.svc.cluster.local -p 5432; do sleep 2; done

              echo "Registering Shard Workers with Citus Coordinator..."
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres.devops-platform.svc.cluster.local -U postgres -d appdb <<-EOSQL
                SELECT citus_set_coordinator_host('postgres.devops-platform.svc.cluster.local', 5432);
                -- Register Worker 0 (Shard 0)
                SELECT citus_add_node('postgres-worker-0.postgres-worker-headless.devops-platform.svc.cluster.local', 5432)
                WHERE NOT EXISTS (
                  SELECT 1 FROM pg_dist_node WHERE nodename = 'postgres-worker-0.postgres-worker-headless.devops-platform.svc.cluster.local'
                );
                -- Register Worker 1 (Shard 1)
                SELECT citus_add_node('postgres-worker-1.postgres-worker-headless.devops-platform.svc.cluster.local', 5432)
                WHERE NOT EXISTS (
                  SELECT 1 FROM pg_dist_node WHERE nodename = 'postgres-worker-1.postgres-worker-headless.devops-platform.svc.cluster.local'
                );
              EOSQL
              echo "✅ Citus Shards successfully registered with Coordinator."
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
      restartPolicy: OnFailure

# ─────────────────────────────────────────────────────────────────────────────
# DB Migrate Job
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: devops-platform
  annotations:
    # Ensure this runs on Helm install/upgrade (if migrated to Helm later)
    "helm.sh/hook": post-install,post-upgrade
spec:
  template:
    spec:
      containers:
        - name: db-migrate
          image: devops/core-service:latest
          imagePullPolicy: Never
          command:
            - "sh"
            - "-c"
            - |
              set -e
              echo "⏳ Waiting for Citus Coordinator and Shards to be fully registered..."
              until psql "$DATABASE_URL" -c "SELECT count(*) FROM pg_dist_node;" | grep -q "[1-9]"; do
                echo "Citus shards not yet registered. Retrying in 2s..."
                sleep 2
              done
              echo "✅ Citus Cluster is ready with registered worker shards."

              echo "🚀 Pushing Prisma database schema..."
              cd packages/db && npx prisma db push --accept-data-loss

              echo "⚙️ Configuring Citus distributed sharding and reference tables..."
              # Enable distributed tables across the 2 worker shards for high-throughput multi-tenant models
              # and reference tables for global lookup data.
              psql "$DATABASE_URL" <<-EOSQL || true
                -- Distribute tenant and submission data by orgId / userId across both shards
                SELECT create_distributed_table('"OrgMember"', 'orgId') WHERE NOT EXISTS (SELECT 1 FROM pg_dist_partition WHERE logicalrelid = '"OrgMember"'::regclass);
                SELECT create_distributed_table('"OrgScenario"', 'orgId') WHERE NOT EXISTS (SELECT 1 FROM pg_dist_partition WHERE logicalrelid = '"OrgScenario"'::regclass);
                SELECT create_distributed_table('"Submission"', 'userId') WHERE NOT EXISTS (SELECT 1 FROM pg_dist_partition WHERE logicalrelid = '"Submission"'::regclass);
                -- Reference tables replicate across all shards for fast local joins
                SELECT create_reference_table('"Category"') WHERE NOT EXISTS (SELECT 1 FROM pg_dist_partition WHERE logicalrelid = '"Category"'::regclass);
              EOSQL

              echo "🌱 Executing Prisma Seed Scripts..."
              npx prisma db seed
              echo "✅ Citus Database migration, distributed table configuration, and seeding complete!"
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets
      restartPolicy: OnFailure


# ─────────────────────────────────────────────────────────────────────────────
# Redpanda Topic Init Job
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-init
  namespace: devops-platform
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec:
  template:
    spec:
      containers:
        - name: redpanda-init
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              # Wait for Redpanda to be ready
              echo "Waiting for Redpanda to be ready..."
              until rpk cluster info --brokers redpanda.devops-platform.svc.cluster.local:9092; do
                sleep 2
              done
              
              BROKERS="redpanda.devops-platform.svc.cluster.local:9092"
              create_topic() {
                local name=$1 partitions=$2 retention_ms=$3
                rpk topic create $name --brokers $BROKERS --partitions $partitions --replicas 3 --topic-config retention.ms=$retention_ms --topic-config cleanup.policy=delete 2>&1 | grep -v "TOPIC_ALREADY_EXISTS" || true
                echo "Topic ready: $name"
              }
              
              create_topic identity.user.registered 4 604800000
              create_topic identity.email.verification 4 604800000
              create_topic sandbox.session.started 8 604800000
              create_topic sandbox.session.ended 8 604800000
              create_topic sandbox.challenge.solved 4 604800000
              create_topic sandbox.challenge.failed 4 604800000
              echo "All Kafka topics provisioned."
          envFrom:
            - configMapRef:
                name: devops-config
      restartPolicy: OnFailure
