apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-config
  namespace: devops-platform
data:
  # Database Config
  POSTGRES_DB: "appdb"
  POSTGRES_USER: "postgres"
  
  # Message Broker Config
  KAFKA_BROKERS: "redpanda.devops-platform.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "prod-client"
  KAFKA_GROUP_ID: "sandbox-sessions"
  KAFKA_ADVERTISED_HOST: "redpanda"
  
  # Service Settings
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  SERVICE_VERSION: "1.0.0"
  SESSION_TTL_MINS: "60"
  MAX_MEMORY_MB: "512"
  MAX_CPUS: "1.0"
  DOCKER_NETWORK_MODE: "none"
  SANDBOX_PROVIDER: "docker"
  OUTBOX_INTERVAL_MS: "1000"
  CORS_ORIGIN: "https://localhost,http://localhost"
  ALLOWED_ORIGINS: "https://localhost,http://localhost"
  DOMAIN: "localhost"
  JWT_ISSUER: "devops-platform"
  MFA_APP_NAME: "DevOps-Platform"
  FRONTEND_URL: "http://localhost:3000"
  WEB_APP_URL: "http://localhost:3000"
  EXPIRY_MFA_TOKEN: "5m"
  EXPIRY_REFRESH_TOKEN: "30d"
  GUEST_TRIAL_TTL_MINS: "10"
  DEFAULT_USER_ROLE: "LEARNER"
  PUBLIC_GATEWAY_URL: "http://localhost:8005"
  
  # Ports (used by the services internally to bind)
  POSTGRES_PORT: "5432"
  REDIS_PORT: "6379"
  RABBITMQ_PORT: "5672"
  RABBITMQ_MGT_PORT: "15672"
  API_GATEWAY_PORT: "8005"
  API_GATEWAY_SECURE_PORT: "8443"
  WEB_FRONTEND_PORT: "3000"
  AUTH_SERVICE_PORT: "3002"
  CORE_SERVICE_PORT: "3003"
  NOTIFICATION_SERVICE_PORT: "3004"
  SANDBOX_WORKER_PORT: "8090"
  SANDBOX_ROUTER_PORT: "8080"
  
  # Note: Observability ports (Grafana, Prometheus, etc.) can be added here if needed, 
  # but they are usually decoupled from the core application namespace.
  OTEL_TRACES_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
  LOKI_URL: "http://loki.observability.svc.cluster.local:3100"

---
apiVersion: v1
kind: Secret
metadata:
  name: devops-secrets
  namespace: devops-platform
type: Opaque
stringData:
  # Database Passwords & URLs
  POSTGRES_PASSWORD: "<STRONG_PASSWORD_PLACEHOLDER>"
  APP_USER_PASSWORD: "<APP_PASSWORD_PLACEHOLDER>"
  # Note: Service names match the K8s Services we will create
  DATABASE_URL: "postgresql://devops_user:<STRONG_PASSWORD_PLACEHOLDER>@postgres.devops-platform.svc.cluster.local:5432/devops_platform?schema=public"
  REDIS_URL: "redis://redis.devops-platform.svc.cluster.local:6379"
  RABBITMQ_URL: "amqp://rabbitmq.devops-platform.svc.cluster.local:5672"

  # Security & Cryptography Secrets
  # RSA keys must maintain exact line breaks
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    <BASE64_ENCODED_RSA_PRIVATE_KEY_PLACEHOLDER>
    -----END PRIVATE KEY-----

  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    <BASE64_ENCODED_RSA_PUBLIC_KEY_PLACEHOLDER>
    -----END PUBLIC KEY-----

  ENCRYPTION_KEY: "<BASE64_32_BYTE_ENCRYPTION_KEY_PLACEHOLDER>"

  # Third-Party Integrations & API Keys (Replace with actual secrets in production/K8s secret manager)
  GOOGLE_CLIENT_ID: "placeholder-google-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "placeholder-google-client-secret"
  GITHUB_CLIENT_ID: "placeholder-github-client-id"
  GITHUB_CLIENT_SECRET: "placeholder-github-client-secret"
  GEMINI_API_KEY: "placeholder-gemini-api-key"
  RESEND_API_KEY: "re_placeholder_resend_api_key"

