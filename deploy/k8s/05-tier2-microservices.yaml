# ─────────────────────────────────────────────────────────────────────────────
# Sandbox Router
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router
  namespace: devops-platform
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: sandbox-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: devops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      containers:
        - name: sandbox-router
          image: docker.io/devops/sandbox-router:latest
          imagePullPolicy: Never
          command: ["/sandbox-router"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: devops-config
            - secretRef:
                name: devops-secrets







