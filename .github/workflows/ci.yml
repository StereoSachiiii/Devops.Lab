name: CI

on:
  push:
    branches: [ "main", "feat/*", "services-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Validate Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx turbo run generate --filter=@devops/db
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint (Affected Packages)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx turbo run lint --filter=...[origin/${{ github.base_ref }}]
          else
            npx turbo run lint --filter=...[HEAD^] || npx turbo run lint --filter=@devops/auth-service
          fi

      - name: Typecheck (Affected Packages)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx turbo run typecheck --filter=...[origin/${{ github.base_ref }}]
          else
            npx turbo run typecheck --filter=...[HEAD^] || npx turbo run typecheck --filter=@devops/auth-service
          fi

      - name: Test (Affected Packages)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx turbo run test --filter=...[origin/${{ github.base_ref }}]
          else
            npx turbo run test --filter=...[HEAD^] || npx turbo run test --filter=@devops/auth-service
          fi
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder


