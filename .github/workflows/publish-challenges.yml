name: Publish Challenge Images to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - "challenges/**"
      - ".github/workflows/publish-challenges.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.challenge.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        challenge:
          - name: bash-scripting
            path: challenges/docker/bash-scripting
          - name: git-basics
            path: challenges/docker/git-basics
          - name: linux-basics
            path: challenges/docker/linux-basics
          - name: nginx-basics
            path: challenges/docker/nginx-basics
          - name: nginx-syntax-fix
            path: challenges/docker/nginx-syntax-fix
          - name: env-var-debugging
            path: challenges/flintlock/env-var-debugging
          - name: kill-runaway-process
            path: challenges/gvisor/kill-runaway-process
          - name: fix-file-permissions
            path: challenges/kata/fix-file-permissions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.challenge.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.challenge.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
