user www-data;
worker_processes 1   # Missing semicolon here will cause syntax error

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;   # Wrong port, must be corrected to 80
        server_name localhost;

        location / {
            root /var/www/html;
            index index.html index.nginx-debian.html;
        }
    }
}
