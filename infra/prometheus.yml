global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "/etc/prometheus/prometheus-alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host-gateway:3002"]

  - job_name: "core-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host-gateway:3003"]

  - job_name: "notification-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host-gateway:3004", "notification-service:3004"]

  - job_name: "sandbox-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host-gateway:8090", "sandbox-worker-docker:8090"]

  - job_name: "sandbox-router"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host-gateway:8080", "sandbox-router:8080"]

  - job_name: "kong"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8001"]

  - job_name: "postgres-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "redpanda"
    metrics_path: "/public_metrics"
    static_configs:
      - targets: ["redpanda:9644"]

