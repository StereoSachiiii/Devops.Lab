_format_version: "3.0"
_transform: true

# Global plugins
plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Cookie
        - Cache-Control
        - Pragma
        - Expires
      exposed_headers:
        - Set-Cookie
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      second: 100
      limit_by: credential
      policy: redis
      redis:
        host: host-gateway
        port: 6379
        database: 1
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true

services:
  - name: core-service
    url: http://core-service:3003
    routes:
      - name: challenge-routes
        paths:
          - /api/challenges
        strip_path: false
      - name: session-routes
        paths:
          - /api/session
        strip_path: false
      - name: content-routes
        paths:
          - /api/content
        strip_path: true
      - name: me-routes
        paths:
          - /api/me
        strip_path: false
      - name: org-routes
        paths:
          - /api/orgs
        strip_path: false
      - name: leaderboard-routes
        paths:
          - /api/leaderboard
        strip_path: false
      - name: assistant-routes
        paths:
          - /api/assistant
        strip_path: false
      - name: article-routes
        paths:
          - /api/articles
        strip_path: false
      - name: user-routes
        paths:
          - /api/users
        strip_path: false
      - name: share-routes
        paths:
          - /api/shares
        strip_path: false
      - name: comment-routes
        paths:
          - /api/comments
        strip_path: false
      - name: list-routes
        paths:
          - /api/lists
        strip_path: false

  - name: auth-service
    url: http://auth-service:3002
    routes:
      - name: auth-routes
        paths:
          - /api/auth
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          second: 100
          limit_by: ip
          policy: redis
          redis:
            host: host-gateway
            port: 6379
            database: 1

  - name: sandbox-service
    url: http://sandbox-router:8080
    routes:
      - name: sandbox-session-routes
        paths:
          - /sessions
        strip_path: false
      - name: sandbox-validate-routes
        paths:
          - /validate
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 500
          limit_by: credential
          policy: redis
          redis:
            host: host-gateway
            port: 6379
            database: 1
